steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t", "gcr.io/$PROJECT_ID/notes-backend",
        "-f", "server/Dockerfile",
        "server/"
      ]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/notes-backend"]

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run", "deploy", "notes-backend",
        "--image", "gcr.io/$PROJECT_ID/notes-backend",
        "--timeout", "1000s",
        "--port", "8080",
        "--region", "asia-southeast2",
        "--allow-unauthenticated",
        "--set-env-vars",
        "DB_HOST=34.172.113.167,DB_PORT=3306,DB_USER=admin,DB_PASSWORD=mypassword,DB_NAME=notes_123230090",
      ]

options:
  logging: CLOUD_LOGGING_ONLY